name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Bản đóng gói không kèm node_modules: main/preload chỉ được require electron và module có sẵn của Node
      - run: npm run check:bundle

  package:
    name: Package and smoke test (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Không ký bằng chứng chỉ thật trong CI
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run pack
      - name: Smoke test the packaged app
        if: runner.os != 'Linux'
        run: npm run test:smoke
      - name: Smoke test the packaged app (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:smoke
